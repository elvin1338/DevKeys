<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522">
<title>DevKeys — справочник разработчика</title>
<style>
:root{--bg:#0d1220;--panel:#151d2e;--panel2:#1b263a;--text:#f2f5fb;--muted:#9aa8bd;--accent:#70e0bd;--line:#29364c;--gold:#ffd477}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#1b3450 0,transparent 38%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:34px}.wrap{max-width:760px;margin:auto;padding:22px 17px 35px}.top{display:flex;align-items:center;gap:12px;margin:8px 0 22px}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#70e0bd,#4da9db);display:grid;place-items:center;color:#10202b;font-weight:900;font-size:23px}.brand{font-size:20px;font-weight:800;letter-spacing:.2px}.sub{color:var(--muted);font-size:12px;margin-top:2px}.hero{padding:21px;border:1px solid #31425b;border-radius:21px;background:linear-gradient(120deg,#1c3046,#172234 70%);margin-bottom:18px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:25px;line-height:1.17;margin:9px 0}.hero p{color:#b5c3d6;line-height:1.5;margin:0;font-size:13px}.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:16px 0}.search span{font-size:18px;color:var(--muted)}input{width:100%;padding:15px 0;background:transparent;border:0;outline:0;color:var(--text);font:inherit}input::placeholder{color:#78879d}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#b6c2d3;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700}.tab.active{background:var(--accent);color:#10251f;border-color:var(--accent)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:13px 2px}.sectionhead h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.item h3{font-size:14px;margin:0 0 5px}.desc{color:var(--muted);font-size:12px;line-height:1.4}.code{display:inline-block;margin-top:10px;padding:7px 10px;border-radius:8px;background:#0b1321;color:var(--accent);font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;max-width:100%;overflow-wrap:anywhere}.actions{display:flex;flex-direction:column;gap:7px}.iconbtn{border:1px solid var(--line);background:var(--panel2);color:#c8d3e2;width:34px;height:34px;border-radius:10px;font-size:16px}.iconbtn.fav{color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:32px 10px}.foot{text-align:center;color:#728198;font-size:11px;margin-top:28px}.pill{font-size:10px;color:#9db1c8;background:#233149;border-radius:6px;padding:4px 7px;display:inline-block;margin-bottom:8px}
.utility{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.utility button,.primary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;font:600 12px system-ui}.primary{background:var(--accent);color:#10251f;border-color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin:10px 0}.panel h3{margin:0 0 9px;font-size:16px}.panel p{color:var(--muted);font-size:13px;line-height:1.5}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:13px ui-monospace,monospace}.choice:active{border-color:var(--accent)}.result{font-size:13px;margin-top:12px;color:var(--accent)}.light{--bg:#f1f5f9;--panel:#ffffff;--panel2:#e8eef5;--text:#172235;--muted:#607087;--accent:#087e68;--line:#d4deea;--gold:#b7791f;background:radial-gradient(ellipse at 85% 0%,#dcecf5 0,transparent 38%),var(--bg)}.light .hero{background:linear-gradient(120deg,#dcecf5,#eef4f8);border-color:#c6d9e6}.light .hero p{color:#52667c}.light .code{background:#edf4f5}.light .tab{color:#52667c}.light .tab.active{color:#fff}.light .logo{color:#fff}.smallnote{font-size:11px;color:var(--muted)}
</style></head>
<body><main class="wrap"><header class="top"><div class="logo">&lt;/&gt;</div><div><div class="brand">DevKeys</div><div class="sub">Карманный справочник разработчика</div></div></header>
<section class="hero"><div class="eyebrow">Быстрее. Проще. Удобнее.</div><h1>Все нужные команды<br>в одном месте</h1><p>Горячие клавиши, терминал, Git и языки программирования. Ищи, копируй и сохраняй полезное.</p></section>
<div class="search"><span>⌕</span><input id="q" placeholder="Найти команду или описание..." autocomplete="off"></div>
<nav class="tabs" id="tabs"></nav><nav class="utility" id="tools"><button data-mode="list">☷ Справочник</button><button data-mode="quiz">🎯 Тест</button><button data-mode="history">◷ История</button><button data-mode="settings">⚙ Настройки</button></nav><div class="sectionhead"><h2 id="heading">Все материалы</h2><span class="count" id="count"></span></div><section id="list"></section><div class="foot">DevKeys • офлайн-справочник • версия 1.1</div></main>
<script>
const data=[
['Клавиши','Windows','Копировать выделенное','Ctrl + C','Копирует выбранный текст или файл.'],['Клавиши','Windows','Вставить','Ctrl + V','Вставляет содержимое буфера обмена.'],['Клавиши','Windows','Вырезать','Ctrl + X','Вырезает выделенный элемент.'],['Клавиши','Windows','Отменить действие','Ctrl + Z','Отменяет последнее действие.'],['Клавиши','Windows','Повторить действие','Ctrl + Y','Повторяет отменённое действие.'],['Клавиши','VS Code','Быстрый поиск файла','Ctrl + P','Открывает поиск файлов по имени.'],['Клавиши','VS Code','Палитра команд','Ctrl + Shift + P','Позволяет запустить любую команду редактора.'],['Клавиши','VS Code','Форматировать документ','Shift + Alt + F','Автоматически форматирует текущий файл.'],['Клавиши','VS Code','Закомментировать строку','Ctrl + /','Добавляет или убирает комментарий.'],['Клавиши','Android Studio','Запустить приложение','Shift + F10','Запускает текущую конфигурацию.'],['Клавиши','Android Studio','Поиск действия','Ctrl + Shift + A','Находит действие или настройку IDE.'],
['Терминал','CMD','Список файлов','dir','Показывает файлы и папки текущего каталога.'],['Терминал','CMD','Перейти в папку','cd имя_папки','Меняет текущий каталог.'],['Терминал','CMD','Очистить экран','cls','Очищает окно командной строки.'],['Терминал','CMD','Создать папку','mkdir имя_папки','Создаёт новую директорию.'],['Терминал','PowerShell','Показать путь','Get-Location','Выводит текущий путь.'],['Терминал','Linux','Список файлов','ls -la','Показывает все файлы, включая скрытые.'],['Терминал','Linux','Текущая папка','pwd','Показывает полный путь текущей директории.'],['Терминал','Linux','Создать папку','mkdir имя_папки','Создаёт директорию.'],['Терминал','Linux','Удалить файл','rm имя_файла','Удаляет указанный файл.'],
['Git','Git','Проверить состояние','git status','Показывает изменённые и новые файлы.'],['Git','Git','Добавить все изменения','git add .','Добавляет изменения в индекс Git.'],['Git','Git','Создать коммит','git commit -m "сообщение"','Сохраняет подготовленные изменения.'],['Git','Git','Отправить изменения','git push','Отправляет коммиты в удалённый репозиторий.'],['Git','Git','Получить изменения','git pull','Загружает изменения и объединяет их с текущей веткой.'],['Git','Git','Клонировать проект','git clone URL','Создаёт локальную копию репозитория.'],['Git','Git','Посмотреть историю','git log --oneline','Показывает краткую историю коммитов.'],
['Языки','Python','Вывести текст','print("Привет, мир!")','Выводит текст или значение в консоль.'],['Языки','Python','Ввод пользователя','input("Введите имя: ")','Получает строку, введённую пользователем.'],['Языки','Python','Цикл по диапазону','for i in range(5):','Повторяет блок кода для значений диапазона.'],['Языки','C++','Подключить ввод и вывод','#include <iostream>','Подключает стандартные потоки ввода и вывода.'],['Языки','C++','Вывести значение','cout << "Hello";','Выводит данные в консоль.'],['Языки','Java','Главный метод','public static void main(String[] args)','Точка входа в Java-программу.'],['Языки','HTML','Заголовок страницы','<h1>Заголовок</h1>','Создаёт заголовок первого уровня.'],['Языки','CSS','Изменить цвет текста','color: #ffffff;','Задаёт цвет текста элемента.']
];
const cats=['Все','Клавиши','Терминал','Git','Языки','Избранное'];
let active='Все',mode='list';
let saved=JSON.parse(localStorage.getItem('devkeys_favs')||'[]');
let history=JSON.parse(localStorage.getItem('devkeys_history')||'[]');
let quiz=null;
const tabs=document.getElementById('tabs'),list=document.getElementById('list'),q=document.getElementById('q');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function renderTabs(){tabs.innerHTML=cats.map(c=>`<button class="tab ${active===c?'active':''}" data-cat="${c}">${c==='Избранное'?'★ ':''}${c}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;mode='list';render()})}
document.getElementById('tools').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
function addHistory(i){history=[i,...history.filter(x=>x!==i)].slice(0,20);localStorage.setItem('devkeys_history',JSON.stringify(history))}
function renderList(){let term=q.value.toLowerCase().trim();let items=data.map((d,i)=>({d,i})).filter(x=>(active==='Все'||x.d[0]===active||(active==='Избранное'&&saved.includes(x.i)))&&x.d.join(' ').toLowerCase().includes(term));document.getElementById('heading').textContent=active==='Все'?'Все материалы':active;document.getElementById('count').textContent=items.length+' записей';list.innerHTML=items.length?items.map(({d,i})=>`<article class="item" data-open="${i}"><div><span class="pill">${esc(d[0])} · ${esc(d[1])}</span><h3>${esc(d[2])}</h3><div class="desc">${esc(d[4])}</div><div class="code">${esc(d[3])}</div></div><div class="actions"><button class="iconbtn ${saved.includes(i)?'fav':''}" data-fav="${i}" title="В избранное">${saved.includes(i)?'★':'☆'}</button><button class="iconbtn" data-copy="${i}" title="Копировать">⧉</button></div></article>`).join(''):'<div class="empty">Ничего не найдено.<br>Попробуйте изменить запрос.</div>';list.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let i=+b.dataset.fav;saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];localStorage.setItem('devkeys_favs',JSON.stringify(saved));render()});list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();let v=data[+b.dataset.copy][3];if(window.Android&&Android.copyText)Android.copyText(v);else if(navigator.clipboard)navigator.clipboard.writeText(v);b.textContent='✓';setTimeout(()=>b.textContent='⧉',900)});list.querySelectorAll('[data-open]').forEach(card=>card.onclick=()=>{addHistory(+card.dataset.open);card.style.borderColor='var(--accent)'})}
function startQuiz(){let i=Math.floor(Math.random()*data.length);let answers=[data[i][3]];while(answers.length<4){let v=data[Math.floor(Math.random()*data.length)][3];if(!answers.includes(v))answers.push(v)}answers.sort(()=>Math.random()-.5);quiz={i,answers,done:false};renderQuiz()}
function renderQuiz(){document.getElementById('heading').textContent='Режим обучения';document.getElementById('count').textContent='Проверь свои знания';let d=data[quiz.i];list.innerHTML=`<div class="panel"><span class="pill">${esc(d[0])} · ${esc(d[1])}</span><h3>Какая команда или комбинация подходит?</h3><p>${esc(d[4])}</p>${quiz.answers.map(a=>`<button class="choice" data-answer="${esc(a)}">${esc(a)}</button>`).join('')}<div id="quizResult" class="result"></div><button class="primary" id="nextQuestion" style="display:none;margin-top:14px">Следующий вопрос →</button><p class="smallnote">Выбери один правильный ответ.</p></div>`;list.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(quiz.done)return;quiz.done=true;let ok=b.dataset.answer===d[3];document.getElementById('quizResult').textContent=ok?'✓ Правильно! Отличная работа.':'✕ Пока неверно. Правильный ответ: '+d[3];document.getElementById('nextQuestion').style.display='inline-block'});document.getElementById('nextQuestion').onclick=startQuiz}
function renderHistory(){document.getElementById('heading').textContent='История просмотров';document.getElementById('count').textContent=history.length+' записей';list.innerHTML=history.length?history.map(i=>{let d=data[i];return `<article class="item"><div><span class="pill">${esc(d[0])} · ${esc(d[1])}</span><h3>${esc(d[2])}</h3><div class="desc">${esc(d[4])}</div><div class="code">${esc(d[3])}</div></div><button class="iconbtn" data-copy="${i}">⧉</button></article>`}).join(''):'<div class="empty">Здесь появятся команды, которые ты открывал в справочнике.</div>';list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let v=data[+b.dataset.copy][3];if(window.Android&&Android.copyText)Android.copyText(v);else navigator.clipboard?.writeText(v);b.textContent='✓'})}
function renderSettings(){document.getElementById('heading').textContent='Настройки';document.getElementById('count').textContent='Персонализация';list.innerHTML=`<div class="panel"><h3>Оформление</h3><p>Выбери удобную тему приложения.</p><button class="primary" id="themeToggle">${document.body.classList.contains('light')?'Включить тёмную тему':'Включить светлую тему'}</button></div><div class="panel"><h3>Мои данные</h3><p>Избранное: ${saved.length} · История: ${history.length}</p><button class="utility" id="clearHistory">Очистить историю</button> <button class="utility" id="clearFav">Очистить избранное</button></div><div class="panel"><h3>О приложении</h3><p>DevKeys — карманный офлайн-справочник горячих клавиш, команд терминала, Git и языков программирования.</p><span class="smallnote">Версия 1.1 · Данные хранятся на устройстве.</span></div>`;document.getElementById('themeToggle').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('devkeys_theme',document.body.classList.contains('light')?'light':'dark');renderSettings()};document.getElementById('clearHistory').onclick=()=>{history=[];localStorage.removeItem('devkeys_history');renderSettings()};document.getElementById('clearFav').onclick=()=>{saved=[];localStorage.removeItem('devkeys_favs');renderSettings()}}
function render(){renderTabs();document.getElementById('tools').querySelectorAll('button').forEach(b=>b.style.borderColor=b.dataset.mode===mode?'var(--accent)':'var(--line)');q.style.display=mode==='list'?'block':'none';document.querySelector('.search').style.display=mode==='list'?'flex':'none';if(mode==='list')renderList();else if(mode==='quiz'){if(!quiz)startQuiz();else renderQuiz()}else if(mode==='history')renderHistory();else renderSettings()}
if(localStorage.getItem('devkeys_theme')==='light')document.body.classList.add('light');q.addEventListener('input',render);render();
</script></body></html>
